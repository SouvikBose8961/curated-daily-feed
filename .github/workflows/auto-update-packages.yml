name: Auto Update NPM Packages (Backend & Frontend)

on:
  schedule:
    - cron: "0 * * * *"  # Runs every hour
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates

      - name: Define branch name
        id: vars
        run: echo "branch_name=auto-upgrade-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Check and update backend dependencies
        id: backend
        run: |
          cd backend
          ncu -u
          npm install
          echo "backend_update_count=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT
          cd ..

      - name: Check and update frontend dependencies
        id: frontend
        run: |
          cd frontend
          ncu -u
          npm install
          echo "frontend_update_count=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT
          cd ..

      - name: Run backend tests (if available)
        if: steps.backend.outputs.backend_update_count != '0'
        run: |
          cd backend
          if npm run | grep -q "test"; then
            echo "🧪 Running backend tests..."
            npm test
          else
            echo "⚠️ No test script found in backend/package.json, skipping tests."
          fi
          cd ..

      - name: Run frontend tests (if available)
        if: steps.frontend.outputs.frontend_update_count != '0'
        run: |
          cd frontend
          if npm run | grep -q "test"; then
            echo "🧪 Running frontend tests..."
            npm test
          else
            echo "⚠️ No test script found in frontend/package.json, skipping tests."
          fi
          cd ..

      - name: Commit and push changes
        if: ${{ steps.backend.outputs.backend_update_count != '0' || steps.frontend.outputs.frontend_update_count != '0' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.vars.outputs.branch_name }}
          git add backend/package*.json frontend/package*.json
          git commit -m "🔄 Auto-update NPM dependencies in backend & frontend [skip ci]" || echo "No changes to commit"
          git push origin HEAD

      - name: Create Pull Request
        if: ${{ steps.backend.outputs.backend_update_count != '0' || steps.frontend.outputs.frontend_update_count != '0' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🤖 Auto Dependency Update - $(date +'%Y-%m-%d %H:%M')"
          body: |
            This PR updates NPM dependencies in both **backend** and **frontend** folders.
            - Backend: ${{ steps.backend.outputs.backend_update_count }} changes
            - Frontend: ${{ steps.frontend.outputs.frontend_update_count }} changes
          branch: ${{ steps.vars.outputs.branch_name }}
          base: Master
          labels: auto-update
