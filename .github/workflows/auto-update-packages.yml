name: Auto Update NPM Packages (Backend & Frontend)

on:
  schedule:
    - cron: "0 0 * * 0"  #  Runs at 00:00 UTC every Sunday
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates

      - name: Update backend dependencies
        run: |
          cd backend
          ncu -u
          npm install
          cd ..

      - name: Update frontend dependencies
        run: |
          cd frontend
          ncu -u
          npm install
          cd ..

      - name: Commit updates to unique branch
        run: |
          BRANCH="auto-upgrade-$(date +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH
          git add backend/package*.json backend/package-lock.json
          git add frontend/package*.json frontend/package-lock.json
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No package updates detected, forcing dummy commit"
            echo "Last check: $(date)" > .last-update.txt
            git add .last-update.txt
          fi
          git commit -m "🔄 Auto-update NPM dependencies [skip ci]" || echo "No changes to commit"
          git push origin HEAD
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.commit.outputs.BRANCH_NAME }}
          base: Master
          title: "🤖 Auto Dependency Update - $(date +'%Y-%m-%d %H:%M')"
          body: |
            This PR updates NPM dependencies in backend and frontend folders.
          labels: auto-update
